[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "runledger"
version = "0.1.0"
description = "Versioned datasets, resumable LLM evaluations, and inspectable evidence."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
authors = [{name = "Eluxsana Subenderan"}]
dependencies = [
  "pyarrow>=19,<24",
  "duckdb>=1.2,<2",
  "typer>=0.15,<1",
  "pydantic>=2.10,<3",
  "numpy>=2,<3",
  "huggingface-hub>=0.29,<2",
  "tqdm>=4.67,<5",
]

[project.optional-dependencies]
hf = ["torch>=2.6,<3", "transformers>=4.49,<6", "safetensors>=0.5,<1"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "hypothesis>=6,<7", "ruff>=0.11,<1", "build>=1.2,<2"]

[project.scripts]
runledger = "runledger.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/runledger"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["integration: process and persistence tests", "hf: requires local downloaded model"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.coverage.run]
source = ["runledger"]
concurrency = ["multiprocessing", "thread"]
parallel = true
patch = ["subprocess"]
omit = ["*/__main__.py"]
